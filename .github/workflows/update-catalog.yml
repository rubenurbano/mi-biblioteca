name: Actualizar catálogo y publicar

on:
  schedule:
    - cron: "17 5 * * *"        # cada día (UTC); GitHub puede retrasarlo unos minutos
  workflow_dispatch:             # botón «Run workflow» (sincronización manual)
  repository_dispatch:           # opcional: otro repo puede avisar con event_type "tutorial-publicado"
    types: [tutorial-publicado]
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "config/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - name: Generar catálogo (si falla, se conserva el anterior y no se despliega)
        run: node scripts/build-catalog.mjs
      - name: Guardar catálogo en el repositorio (historial + estado incremental)
        run: |
          git config user.name "catalog-bot"; git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "catálogo: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - name: Preparar sitio
        run: |
          mkdir _site && cp -r index.html catalog.json assets config/synonyms.json _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
