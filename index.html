<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi biblioteca de tutoriales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#F3F5F2;--card:#fff;--ink:#14211B;--mute:#3d4d45;--line:#D9E0DB;--acc:#0B6E4F;--chip:#E3EBE6;--chipink:#0B4D37}
@media (prefers-color-scheme:dark){:root{--bg:#0F1612;--card:#17211B;--ink:#EAF1EC;--mute:#A9B8AF;--line:#2A382F;--acc:#4FD0A0;--chip:#1F3027;--chipink:#BFEAD7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;margin:0;line-height:1.15}
h1{font-size:clamp(30px,5vw,48px);max-width:720px}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.mute{color:var(--mute);font-size:14px}
.warn{color:#B45309}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;min-height:56px;padding:0 20px;font-size:18px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.main{min-height:56px;padding:0 28px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:21px}.card h3 a{color:var(--ink);text-decoration:none}.card h3 a:hover{text-decoration:underline}
.card p{margin:0;color:var(--mute);overflow-wrap:anywhere}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--chipink);border:0}
.fav{width:44px;height:44px;border:0;background:none;cursor:pointer;color:var(--mute);flex:none;margin:-8px -8px 0 0}
.fav[aria-pressed=true]{color:#D4A017}.fav[aria-pressed=true] path{fill:currentColor}
.head{display:flex;justify-content:space-between;gap:8px}
.open{margin-top:auto;font-weight:600;min-height:44px;display:flex;align-items:center}
.sn{font-size:14px}
select.btn{padding:0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <strong style="font-family:Newsreader,Georgia,serif;font-size:24px">Mi biblioteca</strong>
    <span class="mute" id="status">Cargando catálogo…</span>
  </div>
  <h1>Escribe una idea y encuentra el tutorial.</h1>
  <form class="search" id="f" role="search">
    <label for="q" style="position:absolute;left:-9999px">Buscar tutoriales</label>
    <input id="q" type="search" autocomplete="off" placeholder="Título, tema o palabra del contenido…  (pulsa / para buscar)">
    <button class="btn main" type="submit">Buscar</button>
  </form>
  <div class="row" id="cats" aria-label="Filtrar por tema"></div>
  <div class="row">
    <select class="btn" id="dates" aria-label="Fecha">
      <option value="0">Cualquier fecha</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Último año</option>
    </select>
    <select class="btn" id="sort" aria-label="Orden"><option value="rel">Orden: relevancia</option><option value="date">Orden: fecha</option></select>
    <button class="btn" id="favs" aria-pressed="false">★ Favoritos</button>
    <span style="flex:1"></span>
    <button class="btn" id="refresh">Actualizar</button>
    <a class="btn" id="sync" target="_blank" rel="noopener" style="display:flex;align-items:center;text-decoration:none" href="#">Sincronizar en GitHub</a>
  </div>
  <h2 id="title">Publicaciones recientes</h2>
  <div id="sug" class="mute"></div>
  <div class="grid" id="list"></div>
  <div class="row" style="justify-content:center"><button class="btn" id="more" hidden>Mostrar más</button></div>
</div>
<script src="assets/search.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const S = { cat: new Set(), favs: new Set(), ix: null, cat_: null, shown: 0, rows: [], terms: [] };
  const PAGE = 30;
  try { JSON.parse(localStorage.getItem('fav') || '[]').forEach(x => S.favs.add(x)); } catch (e) {}
  const saveFavs = () => { try { localStorage.setItem('fav', JSON.stringify([...S.favs])); } catch (e) {} };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const days = d => (Date.now() - new Date(d).getTime()) / 864e5;
  const fmt = d => d ? new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const KIND = { tutorial: '', proyecto: 'Proyecto', audio: 'Audio', pdf: 'PDF', video: 'Vídeo' };

  async function load() {
    $('status').textContent = 'Cargando catálogo…';
    try {
      const [c, s] = await Promise.all([
        fetch('catalog.json?t=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); }),
        fetch('synonyms.json').then(r => r.ok ? r.json() : []).catch(() => [])
      ]);
      S.cat_ = c; S.ix = Search.build(c.items, s);
      const age = (Date.now() - new Date(c.generatedAt)) / 36e5;
      $('status').innerHTML = esc(c.items.length) + ' tutoriales · sincronizado ' + esc(new Date(c.generatedAt).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' })) +
        (age > 36 ? ' <span class="warn">· lleva más de 36 h sin sincronizar</span>' : '');
      drawCats(); run();
    } catch (e) { $('status').textContent = 'No se pudo cargar catalog.json'; }
  }

  function drawCats() {
    const n = new Map(); S.cat_.items.forEach(i => (i.categories || []).forEach(c => n.set(c, (n.get(c) || 0) + 1)));
    const top = [...n].sort((a, b) => b[1] - a[1]).slice(0, 14);
    $('cats').innerHTML = '<button class="btn' + (S.cat.size ? '' : ' on') + '" data-c="">Todos</button>' +
      top.map(([c, k]) => '<button class="btn' + (S.cat.has(c) ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + ' <small>' + k + '</small></button>').join('');
  }

  function run() {
    if (!S.ix) return;
    const q = $('q').value.trim(), minDays = +$('dates').value;
    let rows, sugg = '';
    if (q) {
      const r = Search.search(S.ix, q); S.terms = r.terms.map(Search.norm);
      rows = r.results.map(x => x.it);
      if (!rows.length) { const s = Search.suggest(S.ix, q); sugg = s.length ? '¿Quisiste decir <a href="#" data-s="' + esc(s.join(' ')) + '">' + esc(s.join(' ')) + '</a>?' : ''; }
    } else { S.terms = []; rows = S.ix.items.slice(); rows.sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
    if (S.cat.size) rows = rows.filter(i => (i.categories || []).some(c => S.cat.has(c)));
    if (minDays) rows = rows.filter(i => days(i.date) <= minDays);
    if ($('favs').getAttribute('aria-pressed') === 'true') rows = rows.filter(i => S.favs.has(i.id));
    if (q && $('sort').value === 'date') rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    S.rows = rows; S.shown = 0; $('list').innerHTML = '';
    $('title').textContent = q ? rows.length + (rows.length === 1 ? ' resultado' : ' resultados') : 'Publicaciones recientes';
    if (!rows.length) {
      const tops = [...document.querySelectorAll('#cats [data-c]')].slice(1, 6).map(b => '<a href="#" data-sc="' + b.dataset.c + '">' + b.dataset.c + '</a>').join(' · ');
      sugg += (sugg ? '<br>' : '') + 'Sin coincidencias. Prueba con menos palabras, quita filtros o explora: ' + tops;
    }
    $('sug').innerHTML = sugg; more();
  }

  function more() {
    const part = S.rows.slice(S.shown, S.shown + PAGE); S.shown += part.length;
    $('list').insertAdjacentHTML('beforeend', part.map(card).join(''));
    $('more').hidden = S.shown >= S.rows.length;
  }

  function card(i) {
    const sn = S.terms.length && !(i.description || '').length ? Search.snippet(i, S.terms) : '';
    const k = KIND[i.kind] ? '<span class="chip">' + KIND[i.kind] + '</span>' : '';
    return '<article class="card"><div class="head"><h3><a href="' + esc(i.url) + '" target="_blank" rel="noopener">' + esc(i.title) + '</a></h3>' +
      '<button class="fav" data-id="' + esc(i.id) + '" aria-pressed="' + S.favs.has(i.id) + '" aria-label="Favorito"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></div>' +
      (i.description ? '<p>' + esc(i.description) + '</p>' : '') + (sn ? '<p class="sn">' + esc(sn) + '</p>' : '') +
      '<div class="row">' + k + (i.categories || []).slice(0, 4).map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>' +
      '<div class="mute">' + esc(fmt(i.date)) + '</div><a class="open" href="' + esc(i.url) + '" target="_blank" rel="noopener">Abrir →</a></article>';
  }

  let t; const soon = () => { clearTimeout(t); t = setTimeout(run, 90); };
  $('q').addEventListener('input', soon);
  $('f').addEventListener('submit', e => { e.preventDefault(); run(); });
  $('dates').onchange = run; $('sort').onchange = run; $('more').onclick = more;
  $('favs').onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); b.classList.toggle('on'); run(); };
  $('refresh').onclick = load;
  $('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = b.dataset.c; if (!c) S.cat.clear(); else S.cat.has(c) ? S.cat.delete(c) : S.cat.add(c); drawCats(); run(); };
  $('sug').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); if (a.dataset.s) $('q').value = a.dataset.s; if (a.dataset.sc) { S.cat = new Set([a.dataset.sc]); drawCats(); } run(); };
  $('list').onclick = e => { const b = e.target.closest('.fav'); if (!b) return; const id = b.dataset.id; S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); saveFavs(); b.setAttribute('aria-pressed', S.favs.has(id)); if ($('favs').getAttribute('aria-pressed') === 'true') run(); };
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); } });
  // El enlace de sincronización se deduce de la URL de GitHub Pages: usuario.github.io/repositorio/
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split('/')[1];
  if (m && repo) $('sync').href = 'https://github.com/' + m[1] + '/' + repo + '/actions/workflows/update-catalog.yml'; else $('sync').hidden = true;
  load();
})();
</script>
</body>
</html>
